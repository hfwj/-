5" y="1550" font-size="13" text-anchor="start" fill="#173d70">C26</text><text x="635" y="1568" font-size="11" text-anchor="start" fill="#173d70">22uF 25V X7R</text><polyline points="320 1370 820 1370 820 1550 620 1550" fill="none" stroke="#14803c" stroke-width="1.5"/><text x="320" y="1365" font-size="12" text-anchor="start" fill="#173d70">+3V3</text><polyline points="620 1610 620 1840" fill="none" stroke="#14803c" stroke-width="1.5"/><text x="620" y="1835" font-size="12" text-anchor="start" fill="#173d70">GND</text><text x="70" y="1960" font-size="13" text-anchor="start" fill="#173d70">J2P接主控JPP，J2N接主控JPN；输出固定3.3V；整板0.3A为待验证目标。</text><text x="70" y="2000" font-size="13" text-anchor="start" fill="#173d70">C26=22uF/25V/X7R；实际偏压容量、纹波、启动和温升仍需复核。</text><rect x="1515" y="1145" width="1450" height="1010" fill="none" stroke="#6b879c"/><text x="1550" y="1200" font-size="22" text-anchor="start" fill="#173d70">板间拼装与制造核对</text><text x="1560" y="1300" font-size="16" text-anchor="start" fill="#173d70">主板J4P/J4N → 辅源J1P/J1N（15–25V）</text><text x="1560" y="1360" font-size="16" text-anchor="start" fill="#173d70">辅源J2P/J2N → 主控JPP/JPN（3.3V）</text><text x="1560" y="1420" font-size="16" text-anchor="start" fill="#173d70">主控J1 ↔ 主板J3（10芯直通排线）</text><text x="1560" y="1530" font-size="16" text-anchor="start" fill="#173d70">每只板凳柱四脚同网；不是四路接口。</text><text x="1560" y="1590" font-size="16" text-anchor="start" fill="#173d70">保留插件件由工厂焊接，具体型号/焊接服务须订单审核。</text><text x="1560" y="1650" font-size="16" text-anchor="start" fill="#173d70">本图不是PCB布局，不代表已绑定封装或可制板。</text></g></svg>