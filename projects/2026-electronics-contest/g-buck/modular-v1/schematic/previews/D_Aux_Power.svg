ze="9" text-anchor="start" fill="#000080">IN-</text><text x="518" y="261" font-size="8" text-anchor="start" fill="#000080">2</text><line x1="770" y1="240" x2="750" y2="240" stroke="#880000"/><text x="746" y="243" font-size="9" text-anchor="end" fill="#000080">OUT+</text><text x="762" y="236" font-size="8" text-anchor="end" fill="#000080">3</text><line x1="770" y1="265" x2="750" y2="265" stroke="#880000"/><text x="746" y="268" font-size="9" text-anchor="end" fill="#000080">OUT-</text><text x="762" y="261" font-size="8" text-anchor="end" fill="#000080">4</text><polyline points="510 240 445 240" fill="none" stroke="#008000" stroke-width="1.3"/><text x="445" y="236" font-size="10" text-anchor="end" fill="#000080">VIN_SYS</text><polyline points="510 265 445 265" fill="none" stroke="#008000" stroke-width="1.3"/><text x="445" y="261" font-size="10" text-anchor="end" fill="#000080">GND</text><polyline points="770 240 835 240" fill="none" stroke="#008000" stroke-width="1.3"/><text x="835" y="236" font-size="10" text-anchor="start" fill="#000080">+3V3</text><polyline points="770 265 835 265" fill="none" stroke="#008000" stroke-width="1.3"/><text x="835" y="261" font-size="10" text-anchor="start" fill="#000080">GND</text><rect x="920" y="410" width="85" height="70" fill="none" stroke="#880000"/><text x="920" y="386" font-size="12" text-anchor="start" fill="#000080">J2</text><text x="920" y="402" font-size="10" text-anchor="start" fill="#000080">OUTPUT TO C.JP</text><line x1="900" y1="430" x2="920" y2="430" stroke="#880000"/><text x="924" y="433" font-size="9" text-anchor="start" fill="#000080">1</text><text x="908" y="426" font-size="8" text-anchor="start" fill="#000080">1</text><line x1="900" y1="450" x2="920" y2="450" stroke="#880000"/><text x="924" y="453" font-size="9" text-anchor="start" fill="#000080">2</text><text x="908" y="446" font-size="8" text-anchor="start" fill="#000080">2</text><polyline points="900 430 835 430" fill="none" stroke="#008000" stroke-width="1.3"/><text x="835" y="426" font-size="10" text-anchor="end" fill="#000080">+3V3</text><polyline points="900 450 835 450" fill="none" stroke="#008000" stroke-width="1.3"/><text x="835" y="446" font-size="10" text-anchor="end" fill="#000080">GND</text><text x="60" y="550" font-size="13" text-anchor="start" fill="#000080">仅作为 MCU、液晶、采样和 DAC 的辅助供电，禁止代替 A 板主功率电路。</text><text x="60" y="590" font-size="13" text-anchor="start" fill="#000080">可选 MP1584EN 辅源小板；上机前独立调整到 3.30V，输出额定电流不小于0.3A。</text><text x="60" y="630" font-size="13" text-anchor="start" fill="#000080">M1 的 1/2/3/4 是本图自定义端口号，实际接模块 IN+/IN-/OUT+/OUT- 丝印。</text><text x="60" y="670" font-size="13" text-anchor="start" fill="#000080">所有板均由同一输入取电；本方案不接真实电池。</text></g></svg>