"2"/><circle cx="1320" cy="470" r="4" fill="#19384c"/><text x="1105" y="458" font-size="17" fill="#22743e" font-family="Arial,Noto Sans CJK SC,sans-serif">10   ADC_VIN</text><line x1="1090" y1="520" x2="1320" y2="520" stroke="#19384c" stroke-width="2"/><circle cx="1320" cy="520" r="4" fill="#19384c"/><text x="1105" y="508" font-size="17" fill="#22743e" font-family="Arial,Noto Sans CJK SC,sans-serif">11   ADC_IIN</text><line x1="1090" y1="570" x2="1320" y2="570" stroke="#19384c" stroke-width="2"/><circle cx="1320" cy="570" r="4" fill="#19384c"/><text x="1105" y="558" font-size="17" fill="#22743e" font-family="Arial,Noto Sans CJK SC,sans-serif">12   ADC_VOUT</text><line x1="1090" y1="620" x2="1320" y2="620" stroke="#19384c" stroke-width="2"/><circle cx="1320" cy="620" r="4" fill="#19384c"/><text x="1105" y="608" font-size="17" fill="#22743e" font-family="Arial,Noto Sans CJK SC,sans-serif">13   ADC_IOUT</text><line x1="1090" y1="670" x2="1320" y2="670" stroke="#19384c" stroke-width="2"/><circle cx="1320" cy="670" r="4" fill="#19384c"/><text x="1105" y="658" font-size="17" fill="#22743e" font-family="Arial,Noto Sans CJK SC,sans-serif">14   GH_MON</text><line x1="1090" y1="720" x2="1320" y2="720" stroke="#19384c" stroke-width="2"/><circle cx="1320" cy="720" r="4" fill="#19384c"/><text x="1105" y="708" font-size="17" fill="#22743e" font-family="Arial,Noto Sans CJK SC,sans-serif">15   GL_MON</text><line x1="1090" y1="770" x2="1320" y2="770" stroke="#19384c" stroke-width="2"/><circle cx="1320" cy="770" r="4" fill="#19384c"/><text x="1105" y="758" font-size="17" fill="#22743e" font-family="Arial,Noto Sans CJK SC,sans-serif">16   BOOT_MON</text><line x1="390" y1="760" x2="390" y2="772" stroke="#19384c" stroke-width="2"/><line x1="374" y1="772" x2="406" y2="772" stroke="#19384c" stroke-width="2"/><line x1="380" y1="778" x2="400" y2="778" stroke="#19384c" stroke-width="2"/><line x1="386" y1="784" x2="394" y2="784" stroke="#19384c" stroke-width="2"/><text x="70" y="240" font-size="18" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">左侧共6脚：</text><text x="70" y="285" font-size="16" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">1: VIN_EXT -&gt; 25V supply</text><text x="70" y="345" font-size="16" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">3: VSET -&gt; 10V setpoint signal</text><text x="70" y="405" font-size="16" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">4: ISET -&gt; 1V setpoint signal</text><text x="70" y="465" font-size="16" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">5: ARM -&gt; 3.3V pulse at 5ms</text><text x="70" y="525" font-size="16" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">6: MCU_EN -&gt; high after 5.1ms</text><text x="70" y="740" font-size="16" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">17: COM -&gt; global ground 0</text><text x="1370" y="240" font-size="18" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">右侧共11脚：</text><text x="1370" y="295" font-size="16" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">2: VOUT -&gt; load</text><text x="1370" y="340" font-size="16" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">7..16: monitor outputs</text><text x="1370" y="405" font-size="16" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">No extra supply</text><text x="1370" y="440" font-size="16" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">on monitor pins</text><text x="70" y="885" font-size="18" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">模型端口顺序仍为 1 VIN_EXT, 2 VOUT, 3 VSET, ... , 17 COM。图上的左右位置不改变模型顺序。</text><text x="70" y="920" font-size="15" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">If your symbol arrangement differs, keep the correct 17 pin names and explicit model mapping.</text><text x="45" y="958" font-size="12" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">Generated 2026-10-22 | Pin order and model assumptions: ../README.md | COM must be connected to SPICE ground 0</text></svg>