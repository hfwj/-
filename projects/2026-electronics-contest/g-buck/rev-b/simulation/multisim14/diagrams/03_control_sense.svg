<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1000" viewBox="0 0 1700 1000"><rect width="100%" height="100%" fill="white"/><text x="45" y="50" font-size="24" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">03  采样、闭环与保护 / Sensing, continuous control and protection</text><text x="45" y="86" font-size="14" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">Rev B PDF reconstruction | Functional equivalents | Not a manufacturer model or native Multisim schematic</text><line x1="65" y1="340" x2="315" y2="340" stroke="#19384c" stroke-width="2"/><line x1="315" y1="340" x2="315" y2="190" stroke="#19384c" stroke-width="2"/><line x1="315" y1="190" x2="65" y2="190" stroke="#19384c" stroke-width="2"/><line x1="65" y1="190" x2="65" y2="340" stroke="#19384c" stroke-width="2"/><text x="77" y="218" font-size="16" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">电压环 / CV</text><text x="77" y="245" font-size="13" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">VSET × soft-start - 11×ADC_VOUT</text><text x="77" y="267" font-size="13" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">PI: Kp=0.5, Ki=50</text><text x="77" y="289" font-size="13" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">Anti-windup: 500/s</text><line x1="385" y1="340" x2="655" y2="340" stroke="#19384c" stroke-width="2"/><line x1="655" y1="340" x2="655" y2="190" stroke="#19384c" stroke-width="2"/><line x1="655" y1="190" x2="385" y2="190" stroke="#19384c" stroke-width="2"/><line x1="385" y1="190" x2="385" y2="340" stroke="#19384c" stroke-width="2"/><text x="397" y="218" font-size="16" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">电流目标限幅</text><text x="397" y="245" font-size="13" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">IREF = LIMIT(PI+FF,-0.3,ISET)</text><text x="397" y="267" font-size="13" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">ISET=1V represents 1A</text><text x="397" y="289" font-size="13" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">FF=Cout × dVset/dt</text><line x1="730" y1="340" x2="1020" y2="340" stroke="#19384c" stroke-width="2"/><line x1="1020" y1="340" x2="1020" y2="190" stroke="#19384c" stroke-width="2"/><line x1="1020" y1="190" x2="730" y2="190" stroke="#19384c" stroke-width="2"/><line x1="730" y1="190" x2="730" y2="340" stroke="#19384c" stroke-width="2"/><text x="742" y="218" font-size="16" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">电感电流环 / IL</text><text x="742" y="245" font-size="13" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">ILmeas=2×(ADC_IL - V3A/2)</text><text x="742" y="267" font-size="13" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">PI: Kp=0.15, Ki=200</text><text x="742" y="289" font-size="13" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">Feedforward: V_CAP/VIN</text><line x1="1095" y1="340" x2="1330" y2="340" stroke="#19384c" stroke-width="2"/><line x1="1330" y1="340" x2="1330" y2="190" stroke="#19384c" stroke-width="2"/><line x1="1330" y1="190" x2="1095" y2="190" stroke="#19384c" stroke-width="2"/><line x1="1095" y1="190" x2="1095" y2="340" stroke="#19384c" stroke-width="2"/><text x="1107" y="218" font-size="16" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">PWM</text><text x="1107" y="245" font-size="13" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">DUTY = LIMIT(raw,0.08,0.88)</text><text x="1107" y="267" font-size="13" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">Compare with 100kHz CAR</text><text x="1107" y="289" font-size="13" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">Deadtime + enable -&gt; driver</text><line x1="315" y1="265" x2="385" y2="265" stroke="#19384c" stroke-width="2"/><line x1="655" y1="265" x2="730" y2="265" stroke="#19384c" stroke-width="2"/><line x1="1020" y1="265" x2="1095" y2="265" stroke="#19384c" stroke-width="2"/><line x1="1400" y1="340" x2="1635" y2="340" stroke="#19384c" stroke-width="2"/><line x1="1635" y1="340" x2="1635" y2="190" stroke="#19384c" stroke-width="2"/><line x1="1635" y1="190" x2="1400" y2="190" stroke="#19384c" stroke-width="2"/><line x1="1400" y1="190" x2="1400" y2="340" stroke="#19384c" stroke-width="2"/><text x="1412" y="218" font-size="16" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">功率级 / Plant</text><text x="1412" y="245" font-size="13" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">See sheet 01 and 02</text><text x="1412" y="267" font-size="13" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">VOUT + inductor current</text><text x="1412" y="289" font-size="13" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">Sources of feedback</text><line x1="1330" y1="265" x2="1400" y2="265" stroke="#19384c" stroke-width="2"/><line x1="65" y1="580" x2="565" y2="580" stroke="#19384c" stroke-width="2"/><line x1="565" y1="580" x2="565" y2="405" stroke="#19384c" stroke-width="2"/><line x1="565" y1="405" x2="65" y2="405" stroke="#19384c" stroke-width="2"/><line x1="65" y1="405" x2="65" y2="580" stroke="#19384c" stroke-width="2"/><text x="77" y="433" font-size="16" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">电流测量 / Current measurement</text><text x="77" y="460" font-size="13" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">U2: IIN_RAW = 20 × V(RS_IN) = 1V/A</text><text x="77" y="482" font-size="13" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">U3: IOUT_RAW = 20 × V(RS_OUT) = 1V/A</text><text x="77" y="504" font-size="13" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">U4: IL_BI = V3A/2 + 20 × V(RS_L) = V3A/2+0.5V/A</text><text x="77" y="526" font-size="13" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">Each ADC branch: 1kΩ + 4.7nF to GND</text><text x="77" y="548" font-size="13" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">Amplifier output 0..V3A; raw pole ~0.4us (assumed)</text><line x1="625" y1="580" x2="1055" y2="580" stroke="#19384c" stroke-width="2"/><line x1="1055" y1="580" x2="1055" y2="405" stroke="#19384c" stroke-width="2"/><line x1="1055" y1="405" x2="625" y2="405" stroke="#19384c" stroke-width="2"/><line x1="625" y1="405" x2="625" y2="580" stroke="#19384c" stroke-width="2"/><text x="637" y="433" font-size="16" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">电压采样 / Voltage measurement</text><text x="637" y="460" font-size="13" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">VIN_EXT --100k-- VIN_DIV --10k-- GND</text><text x="637" y="482" font-size="13" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">VIN_DIV --1k-- ADC_VIN; 4.7nF to GND</text><text x="637" y="504" font-size="13" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">VOUT --10k-- VOUT_DIV --1k-- GND</text><text x="637" y="526" font-size="13" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">VOUT_DIV --1k-- ADC_VOUT; 4.7nF to GND</text><text x="637" y="548" font-size="13" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">V3 -&gt;10Ω-&gt;V3A; 1uF+100nF+10uF to GND</text><line x1="1115" y1="580" x2="1635" y2="580" stroke="#19384c" stroke-width="2"/><line x1="1635" y1="580" x2="1635" y2="405" stroke="#19384c" stroke-width="2"/><line x1="1635" y1="405" x2="1115" y2="405" stroke="#19384c" stroke-width="2"/><line x1="1115" y1="405" x2="1115" y2="580" stroke="#19384c" stroke-width="2"/><text x="1127" y="433" font-size="16" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">参考网络 / References (all 100nF to GND)</text><text x="1127" y="460" font-size="13" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">V3A --10k-- VREF_POS --33k--1k-- GND</text><text x="1127" y="482" font-size="13" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">V3A --33k--1k-- VREF_NEG --10k-- GND</text><text x="1127" y="504" font-size="13" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">V3A --23k-- VREF_OV --10k-- GND</text><text x="1127" y="526" font-size="13" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">At V3A=3.3V: POS=2.55V, NEG=0.75V, OV=1.00V</text><text x="1127" y="548" font-size="13" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">Actual V3A is lower because R_VDDA carries current</text><line x1="65" y1="825" x2="565" y2="825" stroke="#19384c" stroke-width="2"/><line x1="565" y1="825" x2="565" y2="655" stroke="#19384c" stroke-width="2"/><line x1="565" y1="655" x2="65" y2="655" stroke="#19384c" stroke-width="2"/><line x1="65" y1="655" x2="65" y2="825" stroke="#19384c" stroke-width="2"/><text x="77" y="683" font-size="16" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">比较器功能等效 / Fault comparators</text><text x="77" y="710" font-size="13" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">IL_BI &gt; VREF_POS -&gt; FAULT_N low</text><text x="77" y="732" font-size="13" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">IL_BI &lt; VREF_NEG -&gt; FAULT_N low</text><text x="77" y="754" font-size="13" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">VOUT_DIV &gt; VREF_OV -&gt; FAULT_N low</text><text x="77" y="776" font-size="13" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">Outputs wired-OR, 10k pull-up to 3.3V</text><text x="77" y="798" font-size="13" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">1.3us output RC = assumption, not guaranteed delay</text><line x1="650" y1="825" x2="1125" y2="825" stroke="#19384c" stroke-width="2"/><line x1="1125" y1="825" x2="1125" y2="655" stroke="#19384c" stroke-width="2"/><line x1="1125" y1="655" x2="650" y2="655" stroke="#19384c" stroke-width="2"/><line x1="650" y1="655" x2="650" y2="825" stroke="#19384c" stroke-width="2"/><text x="662" y="683" font-size="16" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">锁存与使能 / Latch and enable</text><text x="662" y="710" font-size="13" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">POR holds reset until 4ms (functional approximation)</text><text x="662" y="732" font-size="13" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">FAULT_N low asynchronously clears SAFE</text><text x="662" y="754" font-size="13" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">ARM rising edge sets SAFE after fault clears</text><text x="662" y="776" font-size="13" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">DRV_EN = SAFE AND MCU_EN</text><text x="662" y="798" font-size="13" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">FAULT cleared alone does not restart switching</text><line x1="1210" y1="825" x2="1635" y2="825" stroke="#19384c" stroke-width="2"/><line x1="1635" y1="825" x2="1635" y2="655" stroke="#19384c" stroke-width="2"/><line x1="1635" y1="655" x2="1210" y2="655" stroke="#19384c" stroke-width="2"/><line x1="1210" y1="655" x2="1210" y2="825" stroke="#19384c" stroke-width="2"/><text x="1222" y="683" font-size="16" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">重要边界 / Not validated</text><text x="1222" y="710" font-size="13" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">Continuous PI is not F103 firmware</text><text x="1222" y="732" font-size="13" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">No LCD/key/ADC sampling-time simulation</text><text x="1222" y="754" font-size="13" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">No actual HC74/HC14 setup/hold/ramp validation</text><text x="1222" y="776" font-size="13" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">No vendor transistor/Miller/saturation model</text><text x="1222" y="798" font-size="13" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">No native Multisim 14 execution on this host</text><line x1="565" y1="745" x2="650" y2="745" stroke="#19384c" stroke-width="2"/><text x="45" y="958" font-size="12" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">Generated 2026-10-22 | Pin order and model assumptions: ../README.md | COM must be connected to SPICE ground 0</text></svg>