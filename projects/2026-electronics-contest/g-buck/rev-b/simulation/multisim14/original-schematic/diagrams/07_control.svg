<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1000" viewBox="0 0 1700 1000"><rect width="100%" height="100%" fill="white"/><text x="40" y="48" font-size="25" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">07  STM32接口与仿真输入边界</text><text x="40" y="85" font-size="16" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">原图逐元件重绘参考 | 位号、数值、网络来自Rev B PDF | 未生成或验证原生.ms14文件</text><text x="78" y="170" font-size="15" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">J_CTL  CONTROL 2x8</text><line x1="235" y1="447" x2="410" y2="447" stroke="#19384c" stroke-width="2"/><line x1="410" y1="447" x2="410" y2="200" stroke="#19384c" stroke-width="2"/><line x1="410" y1="200" x2="235" y2="200" stroke="#19384c" stroke-width="2"/><line x1="235" y1="200" x2="235" y2="447" stroke="#19384c" stroke-width="2"/><text x="247" y="228" font-size="16" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif"></text><line x1="218" y1="222" x2="235" y2="222" stroke="#19384c" stroke-width="2"/><text x="243" y="226" font-size="12" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">1</text><circle cx="218" cy="222" r="4" fill="#19384c"/><text x="75" y="226" font-size="12" fill="#15678c" font-family="Arial,Noto Sans CJK SC,sans-serif">GND</text><line x1="218" y1="251" x2="235" y2="251" stroke="#19384c" stroke-width="2"/><text x="243" y="255" font-size="12" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">2</text><circle cx="218" cy="251" r="4" fill="#19384c"/><text x="75" y="255" font-size="12" fill="#15678c" font-family="Arial,Noto Sans CJK SC,sans-serif">+5V</text><line x1="218" y1="280" x2="235" y2="280" stroke="#19384c" stroke-width="2"/><text x="243" y="284" font-size="12" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">3</text><circle cx="218" cy="280" r="4" fill="#19384c"/><text x="75" y="284" font-size="12" fill="#15678c" font-family="Arial,Noto Sans CJK SC,sans-serif">GND</text><line x1="218" y1="309" x2="235" y2="309" stroke="#19384c" stroke-width="2"/><text x="243" y="313" font-size="12" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">4</text><circle cx="218" cy="309" r="4" fill="#19384c"/><text x="75" y="313" font-size="12" fill="#15678c" font-family="Arial,Noto Sans CJK SC,sans-serif">+3V3</text><line x1="218" y1="338" x2="235" y2="338" stroke="#19384c" stroke-width="2"/><text x="243" y="342" font-size="12" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">5</text><circle cx="218" cy="338" r="4" fill="#19384c"/><text x="75" y="342" font-size="12" fill="#15678c" font-family="Arial,Noto Sans CJK SC,sans-serif">PWM_CTL</text><line x1="218" y1="367" x2="235" y2="367" stroke="#19384c" stroke-width="2"/><text x="243" y="371" font-size="12" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">6</text><circle cx="218" cy="367" r="4" fill="#19384c"/><text x="75" y="371" font-size="12" fill="#15678c" font-family="Arial,Noto Sans CJK SC,sans-serif">GND</text><line x1="218" y1="396" x2="235" y2="396" stroke="#19384c" stroke-width="2"/><text x="243" y="400" font-size="12" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">7</text><circle cx="218" cy="396" r="4" fill="#19384c"/><text x="75" y="400" font-size="12" fill="#15678c" font-family="Arial,Noto Sans CJK SC,sans-serif">MCU_EN</text><line x1="218" y1="425" x2="235" y2="425" stroke="#19384c" stroke-width="2"/><text x="243" y="429" font-size="12" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">8</text><circle cx="218" cy="425" r="4" fill="#19384c"/><text x="75" y="429" font-size="12" fill="#15678c" font-family="Arial,Noto Sans CJK SC,sans-serif">ARM</text><line x1="410" y1="425" x2="426" y2="425" stroke="#19384c" stroke-width="2"/><text x="325" y="429" font-size="12" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">9</text><circle cx="426" cy="425" r="4" fill="#19384c"/><text x="435" y="429" font-size="12" fill="#15678c" font-family="Arial,Noto Sans CJK SC,sans-serif">FAULT_N</text><line x1="410" y1="396" x2="426" y2="396" stroke="#19384c" stroke-width="2"/><text x="325" y="400" font-size="12" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">10</text><circle cx="426" cy="396" r="4" fill="#19384c"/><text x="435" y="400" font-size="12" fill="#15678c" font-family="Arial,Noto Sans CJK SC,sans-serif">GND</text><line x1="410" y1="367" x2="426" y2="367" stroke="#19384c" stroke-width="2"/><text x="325" y="371" font-size="12" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">11</text><circle cx="426" cy="367" r="4" fill="#19384c"/><text x="435" y="371" font-size="12" fill="#15678c" font-family="Arial,Noto Sans CJK SC,sans-serif">ADC_VIN</text><line x1="410" y1="338" x2="426" y2="338" stroke="#19384c" stroke-width="2"/><text x="325" y="342" font-size="12" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">12</text><circle cx="426" cy="338" r="4" fill="#19384c"/><text x="435" y="342" font-size="12" fill="#15678c" font-family="Arial,Noto Sans CJK SC,sans-serif">ADC_IIN</text><line x1="410" y1="309" x2="426" y2="309" stroke="#19384c" stroke-width="2"/><text x="325" y="313" font-size="12" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">13</text><circle cx="426" cy="309" r="4" fill="#19384c"/><text x="435" y="313" font-size="12" fill="#15678c" font-family="Arial,Noto Sans CJK SC,sans-serif">ADC_VOUT</text><line x1="410" y1="280" x2="426" y2="280" stroke="#19384c" stroke-width="2"/><text x="325" y="284" font-size="12" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">14</text><circle cx="426" cy="280" r="4" fill="#19384c"/><text x="435" y="284" font-size="12" fill="#15678c" font-family="Arial,Noto Sans CJK SC,sans-serif">ADC_IOUT</text><line x1="410" y1="251" x2="426" y2="251" stroke="#19384c" stroke-width="2"/><text x="325" y="255" font-size="12" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">15</text><circle cx="426" cy="251" r="4" fill="#19384c"/><text x="435" y="255" font-size="12" fill="#15678c" font-family="Arial,Noto Sans CJK SC,sans-serif">ADC_IL</text><line x1="410" y1="222" x2="426" y2="222" stroke="#19384c" stroke-width="2"/><text x="325" y="226" font-size="12" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">16</text><circle cx="426" cy="222" r="4" fill="#19384c"/><text x="435" y="226" font-size="12" fill="#15678c" font-family="Arial,Noto Sans CJK SC,sans-serif">GND</text><text x="650" y="165" font-size="19" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">外部控制板：按原图保留接口；没有固件模型时不能宣称STM32闭环已仿真。</text><text x="650" y="220" font-size="15" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">J_CTL.2为+5V输入；J_CTL.4为核心板+3V3回送；仿真替代电源不得并接同轨的其他理想源。</text><text x="650" y="271" font-size="15" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">PA8 -&gt; PWM_CTL；PB0 -&gt; MCU_EN；PB1 -&gt; ARM；PB10 &lt;- FAULT_N。</text><text x="650" y="322" font-size="15" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">PA0..PA4依次接ADC_VIN、ADC_IIN、ADC_VOUT、ADC_IOUT、ADC_IL。</text><text x="650" y="373" font-size="15" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">LCD原图：SCK=PA5，MOSI=PA7，CS=PB12，DC=PB13，RST=PB14；VCC=+3V3。</text><text x="650" y="424" font-size="15" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">按键：PB5/PB6/PB7/PB8各经10kΩ上拉+3V3，按键按下接GND；位于外部控制板。</text><text x="650" y="475" font-size="15" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">分块仿真电源：VIN_EXT=15..25V；+12V_DRV=12V；+5V=5V；+3V3=3.3V；负端均接GND。</text><text x="650" y="526" font-size="15" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">仅测功率级时，可断开控制板输出，用PWM源接PWM_CTL、使能源接MCU_EN、脉冲接ARM。</text><text x="650" y="577" font-size="15" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">固定占空比只验证驱动及功率级；CV/CC自动切换需要反馈控制模型或实际固件执行。</text><text x="650" y="628" font-size="15" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">12V/5V/3.3V理想替代电源不包含模块、MCU、LCD等的真实损耗；不能据此核验整机85%效率。</text><text x="650" y="679" font-size="15" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">原图来源：references/G题同步Buck完整原理图_RevB.pdf，第1..7页及第9..10页网络附录。</text><text x="650" y="730" font-size="15" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">本图供Multisim手工放置、接线、核对；实际数据库有无IR2104/INA模型仍需在本机确认。</text><text x="45" y="890" font-size="15" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">控制板替代信号、理想辅助电源及测试负载均为测试夹具，不计入96个主板器件。</text><text x="45" y="960" font-size="15" fill="#19384c" font-family="Arial,Noto Sans CJK SC,sans-serif">同名网络需用真实导线/连接器相连，文字标注本身不是连线。GND接全局地0；NC悬空。日期：2026-10-23</text></svg>